# Nginx sin root (imagen nginxinc/nginx-unprivileged): escucha en 8080, no en 80.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck del contenedor (Compose y Kubernetes)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Proxy a la API: "api" es el nombre del servicio en la red de Compose/Kubernetes
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
