apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: ghcr.io/javiergomezjgb/api:v1.0.0
          ports:
            - containerPort: 3000
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          # ---- Probes: van aquí, dentro del contenedor ----
          startupProbe:
            httpGet: {path: /healthz, port: 3000}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 3000}
            periodSeconds: 10
          readinessProbe:
            # De momento /healthz: aún no hay Redis ni PostgreSQL en el clúster.
            # Cuando los despliegues, cámbialo a /readyz.
            httpGet: {path: /healthz, port: 3000}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports:
    - port: 3000
      targetPort: 3000
